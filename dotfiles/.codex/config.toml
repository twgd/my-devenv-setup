# Stowed to ~/.codex/config.toml. The [projects."..."] keys need absolute paths;
# update them when the home path changes.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
model_verbosity = "low"
personality = "pragmatic"
approval_policy = "never"
sandbox_mode = "danger-full-access"
approvals_reviewer = "user"
web_search = "cached"
project_doc_fallback_filenames = ["CLAUDE.md"]
project_doc_max_bytes = 32768

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[projects."/Users/shane/projects"]
trust_level = "trusted"

[projects."/Users/shane/projects/my-devenv-setup"]
trust_level = "trusted"

[projects."/Users/shane/projects/notion-pks-backup"]
trust_level = "trusted"

[projects."/Users/shane/projects/my-blog"]
trust_level = "trusted"

[projects."/Users/shane/projects/cloudflare-build-notifications"]
trust_level = "trusted"

[projects."/Users/shane/projects/agent-eval"]
trust_level = "trusted"

[projects."/Users/shane/projects/ccxray"]
trust_level = "trusted"

[projects."/Users/shane/projects/agentflow-mentor"]
trust_level = "trusted"

[tui]
notifications = ["agent-turn-complete", "approval-requested"]
notification_method = "auto"
notification_condition = "unfocused"
vim_mode_default = false
status_line = ["model-with-reasoning", "git-branch", "permissions", "context-used", "weekly-limit", "used-tokens", "five-hour-limit"]
status_line_use_colors = true
screen_reader_detection_done = true
terminal_title = ["activity", "thread-name", "project-name", "run-state"]

[tui.model_availability_nux]
gpt-6-astra = 4
"gpt-6.1-sol" = 4

[mcp_servers.cloudflare]
url = "https://mcp.cloudflare.com/mcp"

[mcp_servers.cloudflare.tools.execute]
approval_mode = "approve"

[mcp_servers.cloudflare-docs]
url = "https://docs.mcp.cloudflare.com/mcp"

[mcp_servers.cloudflare-bindings]
url = "https://bindings.mcp.cloudflare.com/mcp"

[mcp_servers.cloudflare-builds]
url = "https://builds.mcp.cloudflare.com/mcp"

[mcp_servers.cloudflare-observability]
url = "https://observability.mcp.cloudflare.com/mcp"

